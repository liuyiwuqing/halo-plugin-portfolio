plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'site.muyin.portfolio'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.27.0')
    implementation 'org.commonmark:commonmark:0.21.0'
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // 组件注册测试同时验证开发目录和实际打包的索引。
    dependsOn tasks.named('jar')
    def pluginJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    inputs.file(pluginJar).withPropertyName('pluginJar')
    systemProperty 'portfolio.pluginJar', pluginJar.get().asFile.absolutePath
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

// 同步而非叠加历史 hash 文件，避免多次构建把旧 Console 资源一起打入 JAR。
// 输出目录必须与 @halo-dev/ui-plugin-bundler-kit 的选择一致：plugin.yaml 的 spec.requires >= 2.25.0 时，
// 打包器把资源基础路径设为 /plugins/{name}/assets/ui/，Halo 也优先从 JAR 的 ui/ 目录提供控制台资源。
// 若这里仍输出到 console/，入口 main.js 能加载，但动态分包的 chunk 会全部 404。
def uiDistDir = project(':ui').layout.buildDirectory.dir('dist')
def staleConsoleUiDir = layout.buildDirectory.dir('resources/main/console')

tasks.register('processUiResources', Sync) {
    from uiDistDir
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
    doFirst {
        // 清理旧版本遗留的 console/ 资源，避免 Halo 回退到与当前打包器不匹配的目录。
        delete staleConsoleUiDir.get().asFile
    }
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

tasks.named('generatePluginComponentsIdx') {
    // DevTools 会在此任务中写入 plugin.yaml 的版本号，必须晚于资源复制。
    dependsOn tasks.named('processResources')
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

// 开发模式优先读取 classes/resources；把最新索引放入资源目录，避免读到历史 JAR 的旧索引。
tasks.register('processPluginComponentsIndex', Copy) {
    from layout.buildDirectory.file('tmp/META-INF/plugin-components.idx')
    into layout.buildDirectory.dir('resources/main/META-INF')
    dependsOn tasks.named('generatePluginComponentsIdx'), tasks.named('processResources')
}

sourceSets.main.output.dir(
    [builtBy: tasks.named('processPluginComponentsIndex')],
    layout.buildDirectory.dir('resources/main'))

halo {
    externalUrl = 'http://127.0.0.1:8090'
    version = '2.27'
}

haloPlugin {
    openApi {
        useExistingServer = true
        outputDir = file("$rootDir/api-docs/openapi/v3_0")
        groupingRules {
            portfolioApis {
                displayName = 'Extension API for Portfolio Plugin'
                pathsToMatch = [
                        '/apis/public.portfolio.muyin.site/v1alpha1/**',
                        '/apis/console.portfolio.muyin.site/v1alpha1/**',
                        '/apis/uc.portfolio.muyin.site/v1alpha1/**'
                ]
            }
        }
        groupedApiMappings = [
                '/v3/api-docs/portfolioApis': 'portfolioApis.json'
        ]
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
        }
    }
}
