<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">项目作品集</title>
    <meta name="description" th:content="${description}" content="集中展示项目作品。"/>
    <style>
        :root {
            --portfolio-ink: #172033;
            --portfolio-muted: #667085;
            --portfolio-line: #e5e7eb;
            --portfolio-bg: #f7f8fb;
            --portfolio-surface: #fff;
            --portfolio-accent: #0f766e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--portfolio-ink);
            background: var(--portfolio-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            line-height: 1.65;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .portfolio-page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 56px 20px 72px;
        }

        .portfolio-header {
            margin-bottom: 28px;
        }

        .portfolio-eyebrow {
            display: block;
            margin-bottom: 12px;
            color: var(--portfolio-accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
        }

        .portfolio-filters {
            display: grid;
            grid-template-columns: 2fr repeat(2, minmax(0, 1fr));
            gap: 16px;
            padding: 22px;
            margin-bottom: 24px;
            background: var(--portfolio-surface);
            border: 1px solid var(--portfolio-line);
            border-radius: 8px;
        }

        .portfolio-field {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
        }

        .portfolio-field input,
        .portfolio-field select {
            width: 100%;
            min-width: 0;
            min-height: 42px;
            padding: 9px 11px;
            border: 1px solid #cbd5e1;
            border-radius: 5px;
            background: var(--portfolio-surface);
            color: var(--portfolio-ink);
            font: inherit;
            font-weight: 400;
        }

        .portfolio-filter-actions,
        .portfolio-result-bar,
        .portfolio-pagination {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
        }

        .portfolio-filter-actions { grid-column: 1 / -1; }
        .portfolio-result-bar { justify-content: space-between; margin: 0 0 16px; color: var(--portfolio-muted); font-size: 14px; }
        .portfolio-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 8px 16px;
            border: 1px solid var(--portfolio-line);
            border-radius: 5px;
            background: var(--portfolio-surface);
            color: var(--portfolio-ink);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .portfolio-button--primary { border-color: var(--portfolio-accent); background: var(--portfolio-accent); color: #fff; }
        .portfolio-button[aria-disabled="true"] { color: #98a2b3; cursor: default; }
        .portfolio-reset { color: var(--portfolio-accent); font-size: 14px; }
        .portfolio-pagination { justify-content: center; margin-top: 32px; font-size: 14px; }
        a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
            outline: 3px solid #2dd4bf;
            outline-offset: 3px;
        }
        a.portfolio-chip:hover { background: #d8eeeb; }
        .portfolio-empty h2 { margin-top: 0; color: var(--portfolio-ink); font-size: 20px; }
        .portfolio-empty p { margin: 8px 0 18px; }


        .portfolio-header h1 {
            margin: 0 0 8px;
            font-size: 34px;
            line-height: 1.2;
        }

        .portfolio-header p {
            margin: 0;
            max-width: 720px;
            color: var(--portfolio-muted);
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .portfolio-card {
            display: flex;
            min-height: 220px;
            flex-direction: column;
            gap: 14px;
            padding: 18px;
            background: var(--portfolio-surface);
            border: 1px solid var(--portfolio-line);
            border-radius: 8px;
        }

        .portfolio-card__cover {
            height: 128px;
            margin: -18px -18px 0;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
            background: #e8eef4;
        }

        .portfolio-card__cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .portfolio-card h2 {
            margin: 0;
            font-size: 18px;
        }

        .portfolio-card p {
            margin: 0;
            color: var(--portfolio-muted);
            font-size: 14px;
        }

        .portfolio-meta,
        .portfolio-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .portfolio-chip {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #eef7f6;
            color: var(--portfolio-accent);
            font-size: 12px;
        }

        .portfolio-card__footer {
            display: flex;
            gap: 12px;
            margin-top: auto;
            font-size: 14px;
        }

        .portfolio-card__footer a {
            color: var(--portfolio-accent);
            font-weight: 600;
        }

        .portfolio-empty {
            padding: 36px;
            text-align: center;
            background: var(--portfolio-surface);
            border: 1px dashed var(--portfolio-line);
            border-radius: 8px;
            color: var(--portfolio-muted);
        }
        .portfolio-card { min-width: 0; }
        .portfolio-card h2, .portfolio-card p { overflow-wrap: anywhere; }

        @media (max-width: 640px) {
            .portfolio-page { padding: 32px 16px 48px; }
            .portfolio-filters { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 12px; }
            .portfolio-header h1 { font-size: 28px; }
            .portfolio-grid { grid-template-columns: minmax(0, 1fr); }
        }
    </style>
</head>
<body>
<main class="portfolio-page">
    <header class="portfolio-header">
        <span class="portfolio-eyebrow">PORTFOLIO / 项目集</span>
        <h1 th:text="${title}">项目作品集</h1>
        <p th:text="${description}">集中展示开源项目、产品、插件、工具和其他开发作品。</p>
    </header>

    <form class="portfolio-filters" method="get" action="/portfolio" role="search" aria-label="筛选项目">
        <label class="portfolio-field">
            搜索项目
            <input type="search" name="keyword" th:value="${filters.keyword}" placeholder="输入名称、简介或项目标识"/>
        </label>
        <label class="portfolio-field">
            来源平台
            <select name="platform">
                <option value="">全部平台</option>
                <option th:each="option : ${platformLabels}" th:value="${option.key}" th:text="${option.value}"
                        th:selected="${filters.platform == option.key}">GitHub</option>
                <option th:if="${!filters.platform.isEmpty() && !platformLabels.containsKey(filters.platform)}"
                        th:value="${filters.platform}" th:text="${filters.platform}" selected>其他平台</option>
            </select>
        </label>
        <label class="portfolio-field">
            项目类型
            <select name="type">
                <option value="">全部类型</option>
                <option th:each="option : ${typeLabels}" th:value="${option.key}" th:text="${option.value}"
                        th:selected="${filters.type == option.key}">插件</option>
                <option th:if="${!filters.type.isEmpty() && !typeLabels.containsKey(filters.type)}"
                        th:value="${filters.type}" th:text="${filters.type}" selected>其他类型</option>
            </select>
        </label>
        <label class="portfolio-field">
            技术栈或标签
            <input type="text" name="tag" th:value="${filters.tag}" placeholder="例如 Java、Vue、效率工具"/>
        </label>
        <label class="portfolio-field">
            推荐状态
            <select name="featured">
                <option value="">全部项目</option>
                <option value="true" th:selected="${filters.featured == 'true'}">只看推荐</option>
                <option value="false" th:selected="${filters.featured == 'false'}">非推荐项目</option>
            </select>
        </label>
        <label class="portfolio-field">
            排序方式
            <select name="sort">
                <option value="priority" th:selected="${filters.sort == 'priority'}">默认排序</option>
                <option value="recent" th:selected="${filters.sort == 'recent'}">最新收录</option>
                <option value="updated" th:selected="${filters.sort == 'updated'}">最近更新</option>
            </select>
        </label>
        <input type="hidden" name="size" th:value="${pageSize}"/>
        <div class="portfolio-filter-actions">
            <button class="portfolio-button portfolio-button--primary" type="submit">查找项目</button>
            <a class="portfolio-reset" href="/portfolio">重置筛选</a>
        </div>
    </form>

    <div class="portfolio-result-bar" aria-live="polite">
        <span th:text="|共 ${totalProjects} 个项目|">共 0 个项目</span>
        <span th:if="${hasFilters}">当前显示符合筛选条件的项目</span>
    </div>

    <div class="portfolio-empty" th:if="${projects.items == null || projects.items.isEmpty()}">
        <h2 th:text="${currentPage > 1 ? '这一页暂无项目' : (hasFilters ? '没有找到匹配的项目' : '暂无公开项目')}">暂无公开项目</h2>
        <p th:text="${hasFilters ? '试试其他关键词、平台或标签。' : '新的作品正在准备中，欢迎稍后再来。'}">欢迎稍后再来。</p>
        <a class="portfolio-button" th:if="${currentPage > 1}" th:href="${firstPageUrl}">返回第一页</a>
        <a class="portfolio-button" th:if="${hasFilters}" href="/portfolio">查看全部项目</a>
    </div>

    <section class="portfolio-grid" th:if="${projects.items != null && !projects.items.isEmpty()}">
        <article class="portfolio-card" th:each="project : ${projects.items}">
            <a class="portfolio-card__cover" th:if="${project.cover != null && !project.cover.isEmpty()}"
               th:href="@{'/portfolio/' + ${project.slug}}">
                <img th:src="${project.cover}" th:alt="${project.title}" loading="lazy" decoding="async"/>
            </a>
            <div class="portfolio-meta">
                <span class="portfolio-chip"
                      th:text="${project.platform != null ? (platformLabels[project.platform] ?: project.platform) : 'other'}">other</span>
                <span class="portfolio-chip"
                      th:text="${project.type != null ? (typeLabels[project.type] ?: project.type) : 'other'}">other</span>
                <span class="portfolio-chip" th:if="${project.featured}">推荐</span>
            </div>
            <h2>
                <a th:href="@{'/portfolio/' + ${project.slug}}" th:text="${project.title}">项目标题</a>
            </h2>
            <p th:text="${project.summary}">项目摘要</p>
            <div class="portfolio-tags" th:if="${project.techStacks != null && !project.techStacks.isEmpty()}">
                <a class="portfolio-chip" th:each="stack : ${project.techStacks}" th:text="${stack}"
                   th:href="@{/portfolio(tag=${stack})}" th:aria-label="|查看使用 ${stack} 的项目|">Java</a>
            </div>
            <div class="portfolio-tags" th:if="${project.tags != null && !project.tags.isEmpty()}">
                <a class="portfolio-chip" th:each="tag : ${project.tags}" th:text="|# ${tag}|"
                   th:href="@{/portfolio(tag=${tag})}"># 工具</a>
            </div>
            <div class="portfolio-meta" th:if="${project.repository != null}" aria-label="仓库快照">
                <span class="portfolio-chip" th:text="|${project.repository.stars} Stars|">0 Stars</span>
                <span class="portfolio-chip" th:text="|${project.repository.forks} Forks|">0 Forks</span>
                <span class="portfolio-chip" th:if="${project.repository.archived}">已归档</span>
            </div>
            <div class="portfolio-card__footer">
                <a th:href="@{'/portfolio/' + ${project.slug}}">详情</a>
                <a th:if="${project.repoUrl != null && !project.repoUrl.isEmpty()}" th:href="${project.repoUrl}" target="_blank"
                   rel="noopener">仓库</a>
                <a th:if="${project.demoUrl != null && !project.demoUrl.isEmpty()}" th:href="${project.demoUrl}" target="_blank"
                   rel="noopener">演示</a>
            </div>
        </article>
    </section>

    <nav class="portfolio-pagination" th:if="${totalPages > 1 || currentPage > 1}" aria-label="项目分页">
        <a class="portfolio-button" th:if="${!previousPageUrl.isEmpty()}" th:href="${previousPageUrl}" rel="prev">上一页</a>
        <span class="portfolio-button" th:if="${previousPageUrl.isEmpty()}" aria-disabled="true">上一页</span>
        <span th:text="|第 ${currentPage} 页 / 共 ${totalPages} 页|" aria-current="page">第 1 页</span>
        <a class="portfolio-button" th:if="${!nextPageUrl.isEmpty()}" th:href="${nextPageUrl}" rel="next">下一页</a>
        <span class="portfolio-button" th:if="${nextPageUrl.isEmpty()}" aria-disabled="true">下一页</span>
    </nav>
</main>
</body>
</html>
